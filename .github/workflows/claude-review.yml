name: Claude Review
# Reviews each PR when it opens (or leaves draft). Add the `review` label to review again after a push;
# the label is removed when the review finishes.
# Dependabot PRs are skipped: workflows they trigger get no repository secrets.
on:
  pull_request:
    types: [opened, ready_for_review, labeled]
jobs:
  review:
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (github.event.action != 'labeled' && !github.event.pull_request.draft) ||
        (github.event.action == 'labeled' && github.event.label.name == 'review')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions: { contents: read, pull-requests: write, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1, 2026-11-20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
      # The label is a button: clear it when the run finishes so adding it again re-reviews.
      - name: Remove review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/review"
