name: Claude Review
# Reviews each PR when it opens (or leaves draft). Add the `review` label to review again after a push;
# the label is removed when the review finishes.
# Dependabot PRs are skipped: workflows they trigger get no repository secrets.
on:
  pull_request:
    types: [opened, ready_for_review, labeled]
jobs:
  review:
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (github.event.action != 'labeled' && !github.event.pull_request.draft) ||
        (github.event.action == 'labeled' && github.event.label.name == 'review')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions: { contents: read, pull-requests: write, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Small PRs get Sonnet's single pass over the diff; larger ones get Opus, which runs the plugin's
      # full multi-agent review and costs several times as much of the plan.
      - name: Pick model by PR size
        id: model
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          OPUS_FROM_LINES: 200
        run: |
          lines=$((ADDITIONS + DELETIONS))
          if [ "$lines" -ge "$OPUS_FROM_LINES" ]; then model=claude-opus-5-5; else model=claude-sonnet-5-5; fi
          echo "$lines changed lines: $model"
          echo "name=$model" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1, 2026-11-20
        env:
          # Opus launched the four reviewers in the background, ended its turn, and the run exited
          # before they reported, so nothing was posted. Foreground agents make it wait for them.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # mp: the owner's skills (JackSwingle01/skills), installed for reference.
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/JackSwingle01/skills.git
          plugins: |
            code-review@claude-plugins-official
            mp@jackswingle01
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model ${{ steps.model.outputs.name }} --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Temporary: runs finish in seconds with no comments, and the default output hides why.
          # Public repo, so this output is public: only on maintainer-labeled runs, and remove once the review posts.
          show_full_output: ${{ github.event.action == 'labeled' }}
      # The label is a button: clear it when the run finishes so adding it again re-reviews.
      - name: Remove review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/review"
