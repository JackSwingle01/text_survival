name: CI

# The fast suite (everything not tagged Slow) on every PR and on pushes to main. The Slow tests and the
# random property search run nightly (nightly.yml); mutation testing at most daily (mutation.yml).
# Branches are checked through their PR (merged with main); push covers only main itself.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build and test stay one job: the tests need the build, and a separate build job would only build twice.
  # The build is its own step, so a compile error still shows as the failing step.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore text_survival.sln
      - run: dotnet build text_survival.sln -c Release --no-restore
      - run: dotnet test text_survival.sln -c Release --no-build --no-restore --filter "Category!=Slow" --logger trx --results-directory TestResults
      # Ratchet: a fast test takes at most 5 s here, except those in rebuild/Sim.Tests/slow-fast-tests.txt
      # (dev/ratchets.md, "fast-test-time"). Also prints the slowest tests.
      - name: Fast tests stay fast
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mapfile -t trx < <(grep -l "Sim.Tests.dll" TestResults/*.trx)
          python3 .github/scripts/test_durations.py "${trx[@]}" --max-seconds 5 --allow rebuild/Sim.Tests/slow-fast-tests.txt

  # GitHub only reports a workflow it cannot parse; actionlint also catches bad expressions,
  # unknown action inputs and shellcheck problems in run steps. Same version as the
  # .githooks/pre-commit hook expects locally.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: get_actionlint
        shell: bash
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - shell: bash
        run: ${{ steps.get_actionlint.outputs.executable }} -color

  # Ratchet: whitespace formatting is enforced only on the C# files a PR touches, so older
  # unformatted files get fixed when they are next edited instead of in one repo-wide reformat.
  # The daily ratchet run (dev/ratchets.md) formats the rest a batch at a time.
  # Fix locally with: dotnet format whitespace --folder --include <files>
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Whitespace formatting of changed C# files
        shell: bash
        run: |
          # The PR checkout is a merge commit whose first parent is the base branch.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.cs')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C# files changed."
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          dotnet format whitespace --folder --verify-no-changes --include "${files[@]}"
