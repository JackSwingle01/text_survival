name: Nightly

# What is too slow for every PR (ci.yml runs only the fast suite), once a night on main:
# - slow: every test tagged Slow, on its fixed seed. The Verification properties are left to the
#   search below, which runs the same tests at ten times the iterations.
# - property-search: the rebuild's property tests (Gens.Check) on fresh CsCheck seeds at ten times
#   the iterations, where CI walks one fixed seed so a push fails only when the code changes.
# A run on main with failures opens one issue for all of them (the report job,
# .github/scripts/nightly_report.py), each test with its message (and seed, for a property) and the
# command that replays it locally (documentation/verification.md). One issue a run, not one a test:
# the issue agent builds each issue on its own branch, so an issue a test had several agents fixing
# one cause in the same code. While that issue is open, the next failing run rewrites it. It carries
# the `nightly` label. The issue agent does not pick it up: github-actions wrote it, and
# issue_queue.py lets through only that bot's `ratchet` issues.
# - npc-bench: the NPC bench (NpcBenchReport) on fixed seeds, published as the `npc-bench` artifact:
#   main's is the baseline a change to NPCs is compared with (.github/scripts/npc_bench_baseline.sh
#   prints the newest). It reports and never gates: its result is not in the run's issue.
# Run it on a branch before merging something risky: gh workflow run nightly.yml --ref <branch>
# (a branch's failures are in its log; they open no issue).

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slow
            target: text_survival.sln
            filter: Category=Slow&FullyQualifiedName!~Survival.Tests.Verification
            search: ""
            iter_factor: ""
          - name: property-search
            target: rebuild/Sim.Tests
            filter: FullyQualifiedName~EffectsPropertyTests|FullyQualifiedName~Survival.Tests.Verification
            search: random
            iter_factor: "10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: dotnet build "$TARGET" -c Release

      - name: Tests
        id: test
        env:
          TARGET: ${{ matrix.target }}
          FILTER: ${{ matrix.filter }}
          SIM_PROPERTY_SEARCH: ${{ matrix.search }}
          SIM_PROPERTY_ITER_FACTOR: ${{ matrix.iter_factor }}
        shell: bash
        run: |
          set +e
          dotnet test "$TARGET" -c Release --no-build --filter "$FILTER" \
            --logger "trx;LogFilePrefix=nightly" --results-directory "$RUNNER_TEMP/results"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # The report job reads these: every job's results make the run's one issue.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-results-${{ matrix.name }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the run when a test failed
        if: steps.test.outputs.exit != '0'
        shell: bash
        run: |
          echo "::error::Nightly ${{ matrix.name }} found failures; the report job files them as one issue."
          exit 1

  # Too long for an issue build (30 minutes a command there), so it runs here and builds read main's.
  # On a branch (workflow_dispatch with --ref) the same artifact is that branch's "after".
  npc-bench:
    name: NPC bench
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NPC_BENCH: "1"
      NPC_BENCH_SEEDS: "1,3,5,7,11,17,42,777,2024,101,202,303,404,505,606,707,808,909,1111,1212"
      NPC_BENCH_DAYS: "60"
      NPC_BENCH_OUT: ${{ runner.temp }}/npc-bench/lines.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build rebuild/Sim.Tests -c Release
      # A seed that never ends is cut off at the hour; the seeds that finished are published all the same.
      - name: Bench
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npc-bench"
          timeout 60m dotnet test rebuild/Sim.Tests -c Release --no-build --filter "FullyQualifiedName~NpcBenchReport" || true
          touch "$NPC_BENCH_OUT"
          {
            echo "NPC bench: $GITHUB_REF_NAME at $GITHUB_SHA, $(date -u +%Y-%m-%d), $NPC_BENCH_DAYS days, Release"
            echo "seeds asked: $NPC_BENCH_SEEDS; finished: $(wc -l < "$NPC_BENCH_OUT")"
            sort -t: -k1.5n "$NPC_BENCH_OUT"
          } | tee "$RUNNER_TEMP/npc-bench/npc-bench.txt"
          { echo '```'; cat "$RUNNER_TEMP/npc-bench/npc-bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm "$NPC_BENCH_OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: npc-bench
          path: ${{ runner.temp }}/npc-bench/npc-bench.txt
          retention-days: 30

  report:
    name: one issue for the run's failures
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Nightly tests failed
    steps:
      - uses: actions/checkout@v7
      - name: Open or rewrite the issue
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/results"
          mkdir -p "$results"
          # A job that failed before its tests ran uploaded nothing: it still gets a folder, and so a line.
          for job in slow property-search; do mkdir -p "$results/nightly-results-$job"; done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'nightly-results-*' --dir "$results" || true
          for dir in "$results"/nightly-results-*; do mv "$dir" "$results/${dir##*/nightly-results-}"; done
          python3 .github/scripts/nightly_report.py "$results" > "$RUNNER_TEMP/body.md"

          gh label create nightly --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The nightly run's failing tests, one issue a run" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label nightly --search "$TITLE in:title" \
                       --limit 100 --json number,title | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Rewritten with the failures of $RUN_URL."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label nightly --body-file "$RUNNER_TEMP/body.md"
          fi
