<title>Text Survival UI Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the cold world fills the screen; warm hide-dark instruments sit on its edges —
   vitals left, the active task right, verbs along the bottom. One visual world, dark only. */
:root {
  --ink: #16110d;        /* smoked hide, panel ground */
  --ink-2: #211913;      /* raised */
  --ink-3: #2d231b;      /* wells, tracks */
  --seam: #4a3726;       /* borders, like stitched hide */
  --bone: #eadfc8;       /* text */
  --bone-2: #b3a68e;     /* secondary text */
  --bone-3: #7d715f;     /* muted */
  --ember: #f5811f;      /* the active, the fire */
  --ochre: #ffc93c;      /* rare finds, highlights */
  --blood: #d13b1f;      /* failure */
  --minus: #cf6f4c;      /* factors that subtract */
  --lichen: #9fbb86;     /* factors that add */
  --frost: #8fa6b7;      /* cold */
  --snow: #e0e9eb;
  --night: #0d1216;
  --f-pixel: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --notch: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
  --notch-s: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--bone);
  font: 500 15px/1.35 var(--f-body);
  overflow: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

.app {
  height: 100%; display: grid;
  grid-template-columns: 1fr minmax(0, 372px);
  grid-template-rows: 1fr auto;
  grid-template-areas: "map side" "dock dock";
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.map { grid-area: map; position: relative; min-width: 0; overflow: hidden; background: var(--night); }
#world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; }

/* ---------- shared pieces ---------- */
.plate {
  background: var(--ink); border: 2px solid var(--seam);
  clip-path: var(--notch);
}
.px { font-family: var(--f-pixel); letter-spacing: .02em; }
.label { font: 500 11px/1 var(--f-pixel); letter-spacing: .08em; text-transform: uppercase; color: var(--bone-3); }
.num { font-family: var(--f-pixel); font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; image-rendering: pixelated; flex: none; }
.ico.x2 { width: 32px; height: 32px; }
.key {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px;
  font: 500 11px/1 var(--f-pixel); color: var(--bone-2);
  background: var(--ink-3); border: 1px solid var(--seam); border-bottom-width: 2px;
}

/* ---------- top: time and weather ---------- */
.sky {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px;
  display: flex; gap: 10px; align-items: stretch; pointer-events: none; flex-wrap: wrap;
}
.sky > * { pointer-events: auto; }
.clock { padding: 8px 12px; display: grid; gap: 6px; min-width: 260px; }
.clock-row { display: flex; align-items: baseline; gap: 10px; }
.clock-time { font: 500 24px/1 var(--f-pixel); }
.clock-day { color: var(--bone-2); }
.dayband { position: relative; height: 10px; background: linear-gradient(90deg,
  #1a2230 0%, #1a2230 22%, #5d4d63 27%, #b9c6cc 34%, #d7e1e4 50%, #b9c6cc 66%, #8a5a48 73%, #2a2433 79%, #1a2230 84%, #1a2230 100%);
  clip-path: var(--notch-s); }
.dayband i { position: absolute; top: -1px; width: 3px; height: 12px; background: var(--ember); box-shadow: 0 0 0 1px var(--ink); transform: translateX(-1px); transition: left .4s; }
.dayband b { position: absolute; top: 0; height: 10px; background: rgba(245,129,31,.35); }
.weather { padding: 8px 12px; display: flex; align-items: center; gap: 14px; }
.wx { display: flex; align-items: center; gap: 6px; }
.wx .num { font-size: 18px; }

/* ---------- left: the body ---------- */
.body {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  padding: 12px 12px 10px; display: grid; gap: 10px; width: 176px;
}
.gauge { display: grid; grid-template-columns: 16px 1fr; gap: 4px 8px; align-items: center; }
.gauge .name { font-size: 13px; color: var(--bone-2); display: flex; justify-content: space-between; }
.gauge .name em { font-style: normal; color: var(--bone-3); font-size: 12px; }
.ticks { grid-column: 2; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 8px; }
.ticks span { background: var(--ink-3); }
.ticks span.on { background: var(--c, var(--bone)); }
.gauge.low .ticks span.on { background: var(--minus); }
.gauge.crit .ticks span.on { background: var(--blood); animation: pulse 1s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.conds { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 4px; border-top: 1px dashed var(--seam); }
.cond { font-size: 12px; padding: 2px 6px; background: var(--ink-3); color: var(--frost); border: 1px solid #3a4a55; clip-path: var(--notch-s); }
.cond.warm { color: var(--ember); border-color: #6b3a18; }

/* ---------- map labels ---------- */
.tip {
  position: absolute; pointer-events: none; padding: 7px 10px; min-width: 150px;
  font-size: 13px; display: grid; gap: 4px; transform: translate(-50%, calc(-100% - 10px));
  white-space: nowrap; z-index: 3;
}
.tip .t { font: 500 14px/1 var(--f-pixel); }
.tip .r { display: flex; gap: 6px; align-items: center; color: var(--bone-2); }

/* ---------- right: the active task ---------- */
.side { grid-area: side; border-left: 2px solid var(--seam); background: var(--ink); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 14px 16px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--seam); background: var(--ink-2); }
.side-head h2 { margin: 0; font: 500 19px/1 var(--f-pixel); flex: 1; text-wrap: balance; }
.side-head .cost { font-size: 13px; color: var(--bone-2); display: flex; gap: 5px; align-items: center; }
.side-body { padding: 14px 16px 18px; overflow-y: auto; display: grid; gap: 16px; align-content: start; min-height: 0; flex: 1; }
.idle { color: var(--bone-3); display: grid; gap: 10px; padding-top: 8px; }
.idle p { margin: 0; max-width: 34ch; }
.where { display: grid; gap: 10px; }
.where-title { display: flex; align-items: center; gap: 10px; }
.where-title strong { font: 500 18px/1.1 var(--f-pixel); }
.feats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.feat { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--ink-2); font-size: 13px; color: var(--bone-2); clip-path: var(--notch-s); }

.section { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px 5px 7px; cursor: pointer;
  background: var(--ink-2); border: 2px solid var(--seam); clip-path: var(--notch-s); font-size: 14px;
}
.chip small { color: var(--bone-3); font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--ember); background: #2a1a0f; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip:not(:disabled):hover { border-color: var(--bone-3); }
.chip[aria-pressed="true"]:hover { border-color: var(--ember); }

/* odds sheet */
.odds { display: grid; gap: 8px; }
.odds-top { display: flex; align-items: baseline; justify-content: space-between; }
.odds-total { font: 600 40px/0.9 var(--f-pixel); font-variant-numeric: tabular-nums; }
.odds-total small { font-size: 20px; color: var(--bone-2); }
.oddsbar { position: relative; height: 14px; background: var(--ink-3); clip-path: var(--notch-s); overflow: hidden; }
.oddsbar .seg { position: absolute; top: 0; bottom: 0; }
.oddsbar .seg.base { background: var(--bone-2); }
.oddsbar .seg.plus { background: var(--lichen); }
.oddsbar .seg.minus { background: repeating-linear-gradient(135deg, var(--minus) 0 3px, #5a2a1a 3px 6px); }
.oddsbar .seg + .seg { box-shadow: inset 2px 0 0 var(--ink); }
.factors { display: grid; gap: 2px; font-size: 14px; }
.factor { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; }
.factor .v { font-family: var(--f-pixel); font-variant-numeric: tabular-nums; text-align: right; min-width: 3ch; }
.factor.plus .v { color: var(--lichen); }
.factor.minus .v { color: var(--minus); }
.factor.base .v { color: var(--bone); }
.factor .why { color: var(--bone-3); font-size: 12px; margin-left: 4px; }

/* the attempt bar */
.run { display: grid; gap: 6px; }
.runbar { position: relative; height: 22px; background: var(--ink-3); border: 2px solid var(--seam); clip-path: var(--notch-s); }
.runbar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--ember) 0 6px, #e06a12 6px 8px); }
.runbar.fail .fill { background: repeating-linear-gradient(90deg, #6a2a1c 0 6px, #5a2216 6px 8px); }
.runbar.ok .fill { background: repeating-linear-gradient(90deg, var(--ochre) 0 6px, #f0b22a 6px 8px); }
.runbar .stop { position: absolute; top: -2px; bottom: -2px; width: 4px; background: var(--blood); box-shadow: 0 0 0 2px var(--ink); }
.runbar.shake { animation: shake .3s steps(3); }
@keyframes shake { 33% { transform: translateX(-3px); } 66% { transform: translateX(3px); } }
.runbar .ticks10 { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0,0,0,.35) calc(10% - 1px) 10%); pointer-events: none; }
.runmeta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--bone-2); min-height: 20px; }
.history { display: flex; gap: 4px; }
.history span { width: 14px; height: 14px; display: grid; place-items: center; font: 600 10px/1 var(--f-pixel); clip-path: var(--notch-s); }
.history .f { background: #4a1d12; color: var(--minus); }
.history .s { background: #4a3a10; color: var(--ochre); }

/* skill */
.skill { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 13px; color: var(--bone-2); }
.skill .lv { font: 500 13px/1 var(--f-pixel); color: var(--bone); }
.pips { display: grid; grid-auto-flow: column; gap: 2px; height: 6px; }
.pips span { background: var(--ink-3); }
.pips span.on { background: var(--ochre); }
.pips span.new { background: var(--ochre); animation: pop .5s steps(3); }
.skill.up .lv { color: var(--ochre); }
@keyframes pop { 0% { transform: scaleY(2.4); } 100% { transform: none; } }

/* buttons */
.act {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  padding: 10px 14px; font: 500 16px/1 var(--f-pixel); letter-spacing: .03em;
  background: var(--ember); color: #1e1006; border: none; clip-path: var(--notch);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
}
.act:hover { filter: brightness(1.08); }
.act:active { box-shadow: inset 0 3px 0 rgba(0,0,0,.25); }
.act:disabled { background: var(--ink-3); color: var(--bone-3); cursor: not-allowed; box-shadow: none; }
.act .key { background: rgba(0,0,0,.18); border-color: rgba(0,0,0,.3); color: inherit; }
.act.quiet { background: var(--ink-2); color: var(--bone); border: 2px solid var(--seam); box-shadow: none; }
.act.quiet .key { background: var(--ink-3); border-color: var(--seam); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .act { flex: 1; }
.note { font-size: 13px; color: var(--bone-3); margin: 0; }

/* fire tend */
.firestate { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.firestate .pit { width: 64px; height: 64px; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, rgba(245,129,31,.35), transparent 70%), var(--ink-3); clip-path: var(--notch); }
.firestate .pit img { width: 48px; height: 48px; image-rendering: pixelated; }
.phase { font: 500 20px/1 var(--f-pixel); }
.burn { position: relative; height: 10px; background: var(--ink-3); margin-top: 6px; clip-path: var(--notch-s); }
.burn i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--blood), var(--ember) 30%, var(--ochre)); }
.fuelrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fuel { display: grid; justify-items: center; gap: 3px; padding: 8px 4px; background: var(--ink-2); border: 2px solid var(--seam); clip-path: var(--notch-s); cursor: pointer; font-size: 13px; }
.fuel small { color: var(--bone-3); font-size: 12px; }
.fuel:hover { border-color: var(--bone-3); }
.fuel:disabled { opacity: .35; cursor: not-allowed; }
.bench { display: grid; gap: 6px; }
.job { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; background: var(--ink-2); clip-path: var(--notch-s); font-size: 14px; }
.job small { display: block; color: var(--bone-3); font-size: 12px; }
.ring { width: 34px; height: 34px; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.job.done { box-shadow: inset 0 0 0 2px var(--ochre); }
.job .state { font: 500 12px/1 var(--f-pixel); color: var(--bone-2); }
.job.done .state { color: var(--ochre); }

/* forage */
.found { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; min-height: 52px; }
.item { display: grid; grid-template-columns: 16px 1fr; gap: 2px 6px; align-items: center; padding: 6px 8px; background: var(--ink-2); clip-path: var(--notch-s); font-size: 13px; }
.item .n { grid-column: 2; font: 500 12px/1 var(--f-pixel); color: var(--bone-2); font-variant-numeric: tabular-nums; }
.item.bump { animation: bump .35s steps(3); }
@keyframes bump { 0% { background: #3d2a14; } 100% { background: var(--ink-2); } }
.item.rare { grid-column: 1 / -1; background: #2c2210; box-shadow: inset 0 0 0 2px var(--ochre); color: var(--ochre); }
.mood { font: 500 12px/1 var(--f-pixel); padding: 4px 7px; letter-spacing: .04em; clip-path: var(--notch-s); }
.mood.good { background: #33300f; color: var(--ochre); }
.mood.thin { background: #2a2f33; color: var(--frost); }
.mood.wait { background: var(--ink-3); color: var(--bone-3); }
.empty { color: var(--bone-3); font-size: 13px; align-self: center; }

/* night */
.lay { display: grid; gap: 6px; }
.layopt { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 10px; background: var(--ink-2); border: 2px solid var(--seam); clip-path: var(--notch-s); cursor: pointer; text-align: left; }
.layopt[aria-pressed="true"] { border-color: var(--ember); background: #2a1a0f; }
.layopt .nm { font: 500 15px/1 var(--f-pixel); }
.layopt .lasts { font-size: 13px; color: var(--bone-2); text-align: right; }
.nightbar { grid-column: 1 / -1; position: relative; height: 8px; background: #1a2230; }
.nightbar i { position: absolute; inset: 0 auto 0 0; background: var(--ember); }
.nightbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--bone-3); }
.layopt .tags { grid-column: 1 / -1; display: flex; gap: 10px; font-size: 12px; color: var(--bone-3); }
.layopt .tags .g { color: var(--lichen); }
.layopt .tags .b { color: var(--minus); }

/* ---------- receipt ---------- */
.veil { position: absolute; inset: 0; background: rgba(8,10,12,.55); display: grid; place-items: center; z-index: 5; padding: 16px; }
.receipt { width: min(460px, 100%); max-height: 100%; overflow: auto; padding: 0; display: grid; animation: drop .35s steps(4); }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
.receipt header { padding: 14px 18px 12px; background: var(--ink-2); border-bottom: 2px solid var(--seam); display: grid; gap: 6px; }
.receipt h3 { margin: 0; font: 500 21px/1 var(--f-pixel); }
.receipt .span { display: flex; gap: 8px; align-items: center; color: var(--bone-2); font-size: 14px; }
.receipt .span .num { color: var(--bone); }
.lines { display: grid; padding: 8px 18px; }
.line { display: grid; grid-template-columns: 44px 22px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--seam); font-size: 15px; }
.line:last-child { border-bottom: 0; }
.line .t { font: 500 12px/1 var(--f-pixel); color: var(--bone-3); font-variant-numeric: tabular-nums; }
.line .who { width: 22px; height: 22px; image-rendering: pixelated; }
.line.bad { color: var(--minus); }
.line.good { color: var(--bone); }
.line.rare { color: var(--ochre); }
.line .amt { font: 500 13px/1 var(--f-pixel); color: var(--bone-2); }
.collected { padding: 10px 18px 12px; background: var(--ink-2); border-top: 2px solid var(--seam); display: grid; gap: 8px; }
.receipt footer { padding: 12px 18px 16px; display: flex; justify-content: flex-end; }

/* ---------- bottom: verbs ---------- */
.dock {
  grid-area: dock; border-top: 2px solid var(--seam); background: var(--ink-2);
  display: flex; gap: 10px; align-items: center; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  overflow-x: auto;
}
.verb {
  display: grid; grid-template-columns: 32px auto; grid-template-rows: auto auto; column-gap: 9px; align-items: center;
  padding: 8px 14px 8px 10px; background: var(--ink); border: 2px solid var(--seam); clip-path: var(--notch);
  cursor: pointer; text-align: left; flex: none; min-width: 150px;
}
.verb img { grid-row: 1 / 3; width: 32px; height: 32px; image-rendering: pixelated; }
.verb .vn { font: 500 16px/1.1 var(--f-pixel); display: flex; gap: 8px; align-items: center; }
.verb .vt { font-size: 12px; color: var(--bone-3); }
.verb:hover { border-color: var(--bone-3); }
.verb[aria-pressed="true"] { border-color: var(--ember); background: #22150c; }
.verb:disabled { opacity: .35; cursor: not-allowed; }
.dock .spacer { flex: 1; }
.load { display: grid; gap: 5px; min-width: 150px; flex: none; }
.load .lb { display: flex; justify-content: space-between; font-size: 12px; color: var(--bone-2); }
.load .bar { height: 8px; background: var(--ink-3); clip-path: var(--notch-s); position: relative; }
.load .bar i { position: absolute; inset: 0 auto 0 0; background: var(--bone-2); }

/* ---------- toast ---------- */
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 12px; display: flex; gap: 8px; align-items: center; font-size: 14px; z-index: 4; animation: drop .3s steps(3); }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; grid-template-columns: 1fr; grid-template-rows: 58vh auto auto; grid-template-areas: "map" "side" "dock";
    padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  .side { border-left: 0; border-top: 2px solid var(--seam); }
  .side-head, .side-body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .body { top: auto; bottom: 12px; transform: none; width: 150px; padding: 8px 10px; gap: 6px; }
  .gauge .name em { display: none; }
  .clock { min-width: 0; flex: 1; }
  .weather { display: none; }
  .dock { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <section class="map" aria-label="The valley">
    <canvas id="world"></canvas>
    <div class="sky">
      <div class="plate clock">
        <div class="clock-row"><span class="clock-time num" id="clockTime">13:05</span><span class="clock-day" id="clockDay">Day 2 · midwinter</span></div>
        <div class="dayband" aria-hidden="true"><b id="daySpan"></b><i id="dayMark"></i></div>
      </div>
      <div class="plate weather">
        <span class="wx"><img class="ico" src="img/ui/temperature.png" alt=""><span class="num" id="airTemp">4°F</span></span>
        <span class="wx"><img class="ico" src="img/ui/wind.png" alt=""><span>Gusting NW</span></span>
        <span class="wx"><img class="ico" src="img/ui/precipitation.png" alt=""><span>Light snow</span></span>
      </div>
    </div>
    <div class="plate body" id="bodyPanel" aria-label="Your body"></div>
    <div class="plate tip" id="tip" hidden></div>
    <div class="veil" id="veil" hidden></div>
    <div class="plate toast" id="toast" hidden></div>
  </section>

  <aside class="side" aria-live="polite">
    <div class="side-head" id="sideHead"></div>
    <div class="side-body" id="sideBody"></div>
  </aside>

  <nav class="dock" id="dock" aria-label="Actions"></nav>
</div>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- assets
const IMG = {};
const SRC = {
  forest: [1,2,3,4,5,6].map(i => `img/forest_tile${i>1?i:''}.png`),

  let i = 0, from = { ...S.player };
  const stepMs = 260;
  function step() {
    if (i >= path.length) { S.walking = false; if (home) arrive(lastSeen); render(); return; }
    const to = path[i], t0 = performance.now();
    (function anim(nw) {
      const p = Math.min(1, (nw - t0) / stepMs); S.drawPos = { x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p };
      exploreAround();
      if (p < 1) return requestAnimationFrame(anim);
      S.player = { ...to }; from = { ...to }; advance(Math.min(5, STEP_MIN[terrain[to.y][to.x]] || 3)); renderClock(); renderBody(); i++; step();
    })(t0);
  }
  step();
}
function arrive(since) {
  const lines = S.campLog.filter(e => e.t > since && e.t <= S.now).map(e => ({ ...e }));
  S.campLog.forEach(e => { if (e.kind === 'tracks' && e.t <= S.now) S.pawsKnown = true; });
  const got = [];
  for (const j of S.jobs) if (!j.collected && S.now >= j.start + j.mins) { j.collected = true; got.push({ icon: j.icon, text: j.out }); lines.push({ t: j.start + j.mins, icon: j.icon, text: `${j.name.replace('Melting', 'Melted').replace('Drying', 'Dried')} · ready`, cls: 'good' }); if (j.id === 'water') S.inv.water += 1.2; }
  for (const j of S.jobs) if (!j.collected && S.now < j.start + j.mins) lines.push({ t: S.now, icon: j.icon, text: `${j.name} · ready at ${fmt(j.start + j.mins)}`, cls: '', pending: true });
  lines.sort((a, b) => a.t - b.t);
  S.campFire.override = fireOut();
  S.campLog = S.campLog.filter(e => e.t > S.now);
  S.seenCamp = { at: S.now, phase: campFireTruth().phase };
  receipt('While you were away', since, S.now, lines, got);
}
function receipt(title, from, to, lines, got) {
  const veil = $('veil');
  veil.innerHTML = `<div class="plate receipt" role="dialog" aria-label="${title}">
    <header><h3>${title}</h3><span class="span"><img class="ico" src="img/ui/clock.png" alt=""><span class="num">${fmt(from)} → ${fmt(to)}</span><span>· ${dur(to - from)}</span></span></header>
    <div class="lines">${lines.length ? lines.map(l => `<div class="line ${l.cls}"><span class="t">${l.pending ? '…' : fmt(l.t)}</span><img class="who" src="img/${l.icon}.png" alt=""><span>${l.text}</span><span class="amt">${l.amt || ''}</span></div>`).join('') : '<div class="line"><span></span><span></span><span style="color:var(--bone-3)">Nothing changed.</span><span></span></div>'}</div>
    ${got.length ? `<div class="collected"><span class="label">Collected</span><div class="chips">${got.map(g => `<span class="chip" style="cursor:default"><img class="ico" src="img/${g.icon}.png" alt="">${g.text}</span>`).join('')}</div></div>` : ''}
    <footer><button class="act" id="cont">Continue <span class="key">Space</span></button></footer></div>`;
  veil.hidden = false; $('cont').focus();
}
function closeReceipt() { $('veil').hidden = true; render(); }
$('veil').addEventListener('click', e => { if (e.target.closest('#cont')) closeReceipt(); });

// ---------------------------------------------------------------- toast
let toastT;
function toast(icon, text) { const t = $('toast'); t.innerHTML = `<img class="ico" src="img/${icon}.png" alt="">${text}`; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
let wasReady = new Set();
function watchJobs() {
  for (const j of S.jobs) { const ready = S.now >= j.start + j.mins && !j.collected;
    if (ready && !wasReady.has(j.id) && atCamp()) toast(j.icon, `${j.out} ready`);
    if (ready) wasReady.add(j.id); }
}

// ---------------------------------------------------------------- side panel router
function renderIdle() {
  const here = atCamp(), k = `${S.player.x},${S.player.y}`;
  head(here ? 'shelter' : 'ui/location', NAMES[k] || TERRAIN_NAME[terrain[S.player.y][S.player.x]], null);
  const feats = here ? [['ui/fire', `Fire · ${campFireTruth().phase}`], ['ui/shelter', 'Lean-to'], ['ui/bedding', 'Bedding'], ['ui/storage', 'Cache · 10 kg']]
                     : [['ui/foraging', 'Good foraging'], ['ui/sticks', 'Deadfall'], ['ui/tracks', 'Hare tracks'], ['ui/wind', 'Exposed']];
  $('sideBody').innerHTML = `<div class="where"><div class="feats">${feats.map(([i, t]) => `<span class="feat"><img class="ico" src="img/${i}.png" alt="">${t}</span>`).join('')}</div></div>
    <div class="idle"><span class="label">Try this</span>
      <p>${here ? 'Check what\'s on the fire, then lay it for the night and sleep. Or head back out.' : 'Your camp fire is drawn as you last saw it. Forage a while, strike a fire, or walk home and see what changed.'}</p></div>`;
}
function render() {
  renderClock(); renderBody(); renderDock(); watchJobs();
  const here = atCamp(), fireHere = here ? campFireTruth().phase !== 'Out' : (S.localFire && S.localFire.x === S.player.x && S.localFire.y === S.player.y && S.now < S.localFire.until);
  if (S.panel === 'fire') { (fireHere && !S.fireTry.result ? renderTend : renderFireStart)(); }
  else if (S.panel === 'forage') renderForage();
  else if (S.panel === 'sleep' && here) renderSleep();
  else renderIdle();
}
$('sideBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.tool) { S.tool = t.dataset.tool; render(); }
  else if (t.dataset.tinder) { S.tinder = t.dataset.tinder; S.fireTry.result = null; render(); }
  else if (t.id === 'attempt') attemptFire();
  else if (t.dataset.focus) { S.forage.focus = t.dataset.focus; render(); }
  else if (t.dataset.mins) { S.forage.mins = +t.dataset.mins; render(); }
  else if (t.id === 'goforage') runForage();
  else if (t.dataset.fuel) { addFuel(t.dataset.fuel, +t.dataset.add); }
  else if (t.id === 'buildup') buildUp();
  else if (t.dataset.lay) { S.lay = t.dataset.lay; render(); }
  else if (t.id === 'dosleep') doSleep();
});
function addFuel(k, add) {
  if (!S.inv[k]) return; S.inv[k]--;
  if (atCamp()) S.campFire.override = Math.max(S.now, fireOut()) + add; else S.localFire.until += add;
  advance(1); render();
}
function buildUp() { if (S.inv.sticks >= 2) { S.inv.sticks -= 2; addFuel('pine', 70); } else if (S.inv.pine) addFuel('pine', 70); }

// keys
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (!$('veil').hidden) { if (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); closeReceipt(); } return; }
  const k = e.key.toLowerCase(); const busy = S.walking || S.fireTry.running || S.forage.running;
  if (k === 'escape') { S.panel = null; render(); return; }
  if (busy) return;
  if (k === 'f') { if (S.panel === 'fire' && !$('attempt')?.disabled && $('attempt')) attemptFire(); else doVerb('fire'); }
  else if (k === 'g') { if (S.panel === 'forage') runForage(); else doVerb('forage'); }
  else if (k === 'r' && S.panel === 'forage') runForage();
  else if (k === 'u' && $('buildup')) buildUp();
  else if (k === 'z' && atCamp()) { if (S.panel === 'sleep') doSleep(); else doVerb('sleep'); }
  else if (k === 'c' && !atCamp()) doVerb('go-camp');
  else if (k === 'b' && atCamp()) doVerb('go-birch');
});

// ---------------------------------------------------------------- boot
(async () => {
  await Promise.all(Object.entries(SRC).map(async ([k, list]) => { IMG[k] = (await Promise.all(list.map(load))).filter(Boolean); }));
  await Promise.all(SPRITES.map(async s => { IMG[s] = await load(`img/${s}.png`); }));
  await Promise.all(['ui/water', 'ui/meat'].map(async s => { IMG[s] = await load(`img/${s}.png`); }));
  resize(); render(); requestAnimationFrame(frame);
})();
})();
</script>
